<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeskAgent Chat - Anime Companion</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Nunito (Soft, friendly anime style) -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: transparent !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Soft light anime glassmorphism - Richer blue gradient */
    .anime-glass {
      background: linear-gradient(135deg, rgba(224, 242, 254, 0.93) 0%, rgba(186, 230, 253, 0.88) 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(24px);
      box-shadow: 0 12px 40px rgba(14, 165, 233, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    /* Message glass bubbles */
    .message-glass-user {
      background: rgba(14, 165, 233, 0.22); /* Deeper Sky blue glass */
      border: 1px solid rgba(14, 165, 233, 0.35);
      backdrop-filter: blur(8px);
      color: #0369a1; /* sky-700 */
      border-radius: 18px 18px 4px 18px; /* messenger style left-bottom corner flat for user */
    }

    .message-glass-bot {
      background: rgba(255, 255, 255, 0.75); /* White glass with high opacity */
      border: 1px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      color: #334155; /* slate-700 */
      border-radius: 18px 18px 18px 4px; /* messenger style right-bottom corner flat for bot */
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.05);
    }

    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(14, 165, 233, 0.25);
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(14, 165, 233, 0.45);
    }

    /* Pulse animation for active state */
    @keyframes softPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
    }
    .online-indicator {
      animation: softPulse 2s infinite ease-in-out;
    }

    /* Drag regions */
    .drag-region {
      -webkit-app-region: drag;
    }
    .no-drag-region {
      -webkit-app-region: no-drag;
    }
  </style>
</head>
<body class="p-4 flex items-center justify-center">
  <!-- Main Glassmorphic Container -->
  <div id="chatWidget" class="w-full h-full flex flex-col anime-glass rounded-3xl overflow-hidden relative">
    
    <!-- Window Header -->
    <header class="drag-region flex items-center justify-between px-5 py-4 bg-white/20 border-b border-white/40">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 online-indicator"></span>
        <span class="font-bold text-sm text-sky-900 tracking-wide">DeskAgent Chat</span>
      </div>
      
      <!-- Window controls -->
      <div class="no-drag-region flex items-center gap-1.5">
        <button id="btnMinimize" class="w-6 h-6 flex items-center justify-center text-sky-800 hover:bg-sky-500/10 rounded-full transition" title="Minimize">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button id="btnClose" class="w-6 h-6 flex items-center justify-center text-sky-800 hover:bg-rose-500/10 hover:text-rose-600 rounded-full transition" title="Close">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </header>

    <!-- Chat Messages Log -->
    <div id="chatLog" class="flex-1 overflow-y-auto p-5 flex flex-col gap-4 custom-scrollbar">
      <!-- System Message -->
      <div class="self-center py-1.5 px-3 rounded-full bg-white/30 border border-white/50 text-[10px] font-semibold text-sky-800/60 uppercase tracking-widest">
        Hộp thoại bảo mật
      </div>
    </div>

    <!-- RAG / Task Progress Area (Checklist) -->
    <div id="checklistArea" class="hidden px-5 py-2.5 bg-white/30 border-t border-white/40 flex flex-col gap-1.5">
      <h4 class="text-[9px] font-extrabold text-sky-900/60 uppercase tracking-wider">Tiến độ công việc</h4>
      <ul id="checklistItems" class="text-xs text-sky-950 flex flex-col gap-1 max-h-24 overflow-y-auto custom-scrollbar"></ul>
    </div>

    <!-- Input Footer Form -->
    <footer class="p-4 bg-white/10 border-t border-white/30">
      <form id="chatForm" class="flex gap-2 items-center relative">
        <input 
          id="chatInput" 
          type="text" 
          placeholder="Nói gì đó với DeskAgent..." 
          autocomplete="off"
          class="flex-1 px-4 py-2.5 bg-white/60 border border-white/80 rounded-2xl text-xs text-slate-800 placeholder-sky-900/40 focus:outline-none focus:bg-white/80 focus:border-sky-400 focus:ring-1 focus:ring-sky-400 transition"
        />
        
        <button 
          type="submit" 
          class="p-2.5 bg-sky-500 hover:bg-sky-600 text-white rounded-2xl active:scale-95 transition flex items-center justify-center"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>
    </footer>
  </div>

  <!-- JS implementation file -->
  <script type="module" src="chat-window.js"></script>
</body>
</html>
