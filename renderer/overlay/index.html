<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Companion Floating Widget</title>
    <link rel="stylesheet" href="./overlay.css" />
    <link rel="stylesheet" href="../chat/chat.css" />
  </head>
  <body>
    <main class="overlay-app-container">
      
      <!-- ==========================================
           WIDGET 1: LOADING BOX (Screenshot 1)
           ========================================== -->
      <div id="loadingBox" class="loading-overlay-box">
        <div class="loading-spinner"></div>
        <span>Loading...</span>
      </div>

      <!-- ==========================================
           WIDGET 2: FLOATING WIFI BUTTON (Left side)
           ========================================== -->
      <button id="floatingWifiBtn" class="floating-btn wifi-btn active" type="button" title="Connection Status">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/></svg>
      </button>

      <!-- ==========================================
           WIDGET 3: FLOATING CONTROL BUTTONS (Right side, stacked vertically)
           ========================================== -->
      <div class="right-floating-stack">
        <!-- Chevron expand/collapse menu -->
        <button id="btnToggleMenu" class="floating-btn toggle-menu-btn" type="button" title="Toggle Control Panel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
        </button>
        <!-- Microphone status toggle -->
        <button id="btnToggleMic" class="floating-btn mic-btn muted" type="button" title="Mute/Unmute Mic">
          <svg id="svgMicNormal" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="display: none;"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          <svg id="svgMicMuted" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <!-- Move / Drag trigger handle -->
        <button id="btnDragHandle" class="floating-btn drag-btn" type="button" title="Drag / Move Window">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
        </button>
      </div>

      <!-- ==========================================
           WIDGET 4: FLOATING GLASS CONTROL PANEL (Screenshot 2)
           ========================================== -->
      <div id="controlPanel" class="floating-control-panel">
        <!-- Sign in header row -->
        <div class="panel-header-signin">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          <span>Sign in</span>
        </div>

        <!-- 6 Quick control buttons in a grid -->
        <div class="panel-grid-buttons">
          <button class="grid-opt-btn" id="btnWebcamTracking" type="button" title="Webcam Tracking">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </button>
          <button class="grid-opt-btn" id="btnQuickEmotions" type="button" title="Quick Emotions">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          </button>
          <button class="grid-opt-btn" id="btnQuickAccessories" type="button" title="Accessories">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.34 2.23l.58 3.47a1 1 0 00.99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 002-2V10h2.15a1 1 0 00.99-.84l.58-3.47a2 2 0 00-1.34-2.23z"/></svg>
          </button>
          <button class="grid-opt-btn" id="btnToggleChat" type="button" title="Toggle Chat Panel">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button class="grid-opt-btn" id="btnReloadAvatar" type="button" title="Reload Character">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          </button>
          <button class="grid-opt-btn" id="btnCalibration" type="button" title="Calibration">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          </button>
          <button class="grid-opt-btn" id="btnQuickSettings" type="button" title="Quick Settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>

        <!-- Footer actions: Pin, Hide, Quit -->
        <div class="panel-footer-actions">
          <button class="footer-action-icon-btn" id="btnPinWindow" type="button" title="Pin Window (Always on Top)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-.44-1.24l-2.78-3.58A2 2 0 0 1 15 9.18V5a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4.18c0 .41-.12.82-.36 1.15L5.85 13.9a2 2 0 0 0-.41 1.18V17z"/></svg>
          </button>
          <button class="footer-action-icon-btn" id="btnHideAvatar" type="button" title="Hide Avatar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
          <button class="footer-action-icon-btn" id="btnQuitApp" type="button" title="Close Companion">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
          </button>
        </div>
      </div>

      <!-- Quick Emotions Popup -->
      <div id="emotionsPopup" class="emotions-popup hidden">
        <button data-emo="smile">😊 Vui vẻ</button>
        <button data-emo="happy">😂 Hớn hở</button>
        <button data-emo="thinking">🤔 Suy tư</button>
        <button data-emo="sad">😢 U sầu</button>
        <button data-emo="surprised">😮 Kinh ngạc</button>
      </div>

      <!-- Quick Accessories Popup -->
      <div id="accessoriesPopup" class="emotions-popup hidden" style="min-width: 150px; left: 160px; top: 110px;">
        <!-- Dynamically populated based on model -->
      </div>

      <!-- Webcam Overlay Mini -->
      <div id="webcamOverlay" class="webcam-overlay hidden">
        <video id="webcamVideo" autoplay playsinline muted></video>
        <div class="webcam-glow"></div>
        <div class="scan-line"></div>
      </div>

      <!-- ==========================================
           AVATAR MAIN CONTAINER
           ========================================== -->
      <section class="avatar-stage">
        <div class="avatar-wrap" id="avatarWrap" data-expression="normal" data-motion="idle" style="opacity: 0; transition: opacity 0.3s;">
          <img id="avatarImage" class="avatar-image" src="../../assets/live2d/IceGirl/textures/texture_03.png" alt="IceGirl" style="display: none;" />
          <div class="expression-light" id="expressionLight"></div>
        </div>
      </section>

      <!-- ==========================================
           CHAT PANEL (Hidden by default, toggled via Chat button)
           ========================================== -->
      <section class="chat-panel" id="chatPanel" style="display: none;">
        <div class="chat-header">
          <div>
            <h1 id="chatAvatarName">IceGirl</h1>
            <p>AI Companion</p>
          </div>
          <button id="btnCloseChat" class="close-chat-btn" type="button">&times;</button>
        </div>

        <div id="chatLog" class="chat-log"></div>

        <form id="chatForm" class="chat-form">
          <button type="button" id="attachButton" class="attach-btn" title="Attach Image">📎</button>
          <input id="chatInput" type="text" autocomplete="off" placeholder="Hỏi gì đó..." />
          <button type="submit">Send</button>
        </form>
        <input type="file" id="fileInput" accept="image/*" style="display: none" />
      </section>

      <!-- ========================================================
           MODAL: ZIP CONFIG SELECTOR
           ======================================================== -->
      <div class="modal-overlay" id="zipConfigModal" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 99999;">
        <div class="modal-container" style="width: 320px; background: rgba(30, 30, 40, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
          <header class="modal-header" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.2);">
            <h2 class="modal-title" style="color: #fff; font-size: 14px; font-weight: 600; margin: 0;">Chọn cấu hình</h2>
            <button class="modal-close-btn" id="zipConfigBtnClose" type="button" style="color: rgba(255,255,255,0.6); background: transparent; border: none; font-size: 18px; cursor: pointer; padding: 0; line-height: 1;">
              &times;
            </button>
          </header>
          <div class="modal-content-scroll" style="padding: 16px;">
            <p style="margin-top: 0; margin-bottom: 12px; color: rgba(255,255,255,0.7); font-size: 11px; line-height: 1.4;">Tệp ZIP chứa nhiều cấu hình nhân vật. Hãy nhấp chọn tệp cấu hình bạn muốn sử dụng:</p>
            <div class="zip-config-list" id="zipConfigList" style="display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto;">
              <!-- Rendered dynamically -->
            </div>
          </div>
        </div>
      </div>

    </main>

    <script type="importmap">
      {
        "imports": {
          "@esotericsoftware/spine-webgl": "../../node_modules/@esotericsoftware/spine-webgl/dist/esm/spine-webgl.mjs",
          "three": "../../node_modules/three/build/three.module.js",
          "three/examples/jsm/loaders/GLTFLoader.js": "../../node_modules/three/examples/jsm/loaders/GLTFLoader.js",
          "@pixiv/three-vrm": "../../node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
          "@pixiv/three-vrm-animation": "../../node_modules/@pixiv/three-vrm-animation/lib/three-vrm-animation.module.js"
        }
      }
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
